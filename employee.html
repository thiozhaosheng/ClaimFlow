<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClaimFlow Portal - Submit Claim</title>

    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />

    <!-- cdn icons -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
      crossorigin="anonymous"
    ></script>

    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

    <!-- custom css -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header id="app-header">
      <div class="header-container">
        <div class="brand-meta">
          <div class="logo-box">
            <i class="fa-solid fa-building-columns text-white fs-5"></i>
          </div>

          <div>
            <h1 class="brand-title">ClaimFlow Portal</h1>
            <p class="user-meta">
              Logged in as: <span id="current-user-email">...</span>
            </p>
          </div>
        </div>

        <div class="nav-actions">
          <div class="role-switcher-group btn-group" role="group">
            <a
              href="employee.html"
              id="nav-btn-employee"
              class="btn btn-nav text-nowrap active"
              ><i class="fa-solid fa-user-tie me-2"></i>Employee</a
            >

            <a
              href="approving.html"
              id="nav-btn-approving"
              class="btn btn-nav text-nowrap"
              ><i class="fa-solid fa-user-check me-2"></i>Approving Officer</a
            >

            <a
              href="finance.html"
              id="nav-btn-finance"
              class="btn btn-nav text-nowrap"
              ><i class="fa-solid fa-wallet me-2"></i>Finance</a
            >
          </div>

          <button
            class="btn btn-logout ms-2 text-nowrap"
            onclick="handleLogout()"
          >
            <i class="fa-solid fa-right-from-bracket me-2"></i>Logout
          </button>
        </div>
      </div>
    </header>

    <main class="container-fluid py-4">
      <section id="view-employee" class="role-workspace" data-aos="fade-up">
        <div class="row g-4">
          <div class="col-lg-8">
            <div class="workspace-card p-4">
              <h2 class="workspace-card-title mb-4">
                <span class="plus-icon-badge me-2"
                  ><i class="fa-solid fa-plus"></i
                ></span>
                Submit New Claim
              </h2>

              <form
                id="claim-submission-form"
                onsubmit="handleClaimSubmission(event)"
              >
                <div class="mb-3">
                  <label class="form-label">Claim Title</label>
                  <input
                    type="text"
                    id="emp-claim-title"
                    class="form-control"
                    placeholder="e.g., Client Meeting Lunch"
                    required
                  />
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Expense Date</label>
                    <input
                      type="date"
                      id="emp-claim-date"
                      class="form-control"
                      required
                    />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label">Category</label>
                    <select id="emp-claim-category" class="form-select">
                      <option value="Travel">Travel</option>
                      <option value="Meal">Meal</option>
                      <option value="Medical">Medical</option>
                      <option value="Training">Training</option>
                    </select>
                  </div>
                </div>

                <div class="mb-4">
                  <label class="form-label">Amount</label>
                  <div class="input-group">
                    <span
                      class="input-group-text bg-white border-end-0 text-secondary"
                      >$</span
                    >
                    <input
                      type="number"
                      step="0.01"
                      id="emp-claim-amount"
                      class="form-control border-start-0 ps-1"
                      placeholder="0.00"
                      required
                    />
                  </div>
                </div>

                <div class="mb-4">
                  <label class="form-label">Receipt Upload</label>
                  <input
                    type="file"
                    id="receipt-native-file"
                    class="d-none"
                    onchange="handleFileSelected(event)"
                  />
                  <div
                    id="receipt-dropzone"
                    class="file-dropzone"
                    onclick="triggerFileBrowser()"
                  >
                    <i
                      class="fa-solid fa-cloud-arrow-up dropzone-icon mb-2"
                    ></i>
                    <p id="dropzone-text" class="m-0">
                      Drag and drop your receipt here, or click to browse
                    </p>
                    <span class="dropzone-subtext"
                      >PDF, JPG, PNG up to 10MB</span
                    >
                  </div>
                </div>

                <button
                  type="submit"
                  class="btn btn-primary w-100 py-2 font-medium"
                >
                  Submit Claim
                </button>
              </form>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="workspace-card p-4 h-100">
              <h3 class="panel-subtitle mb-4">Recent Claims</h3>
              <div id="employee-recent-claims-list" class="vstack gap-3"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer></footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- JS -->
    <script src="js/app.js"></script>
    <script>
      AOS.init({
        disable: "phone",
        duration: 800,
        once: true,
      });
    </script>
  </body>
</html>
