<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClaimFlow Portal - Sign In</title>

    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />

    <!-- cdn icons -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
      crossorigin="anonymous"
    ></script>

    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

    <!-- custom css -->

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container-fluid py-4">
      <section id="view-signin" class="auth-wrapper">
        <div class="auth-center-header text-center mb-4" data-aos="fade-down">
          <div class="auth-logo mb-3">
            <i class="fa-solid fa-building-columns text-white fs-3"></i>
          </div>
          <h2 class="auth-brand">ClaimFlow Portal</h2>
          <p class="text-secondary small">Expense Claim Management System</p>
        </div>

        <div class="auth-card mx-auto" data-aos="zoom-in">
          <h3 class="auth-card-title">Sign In</h3>
          <form id="signin-form" onsubmit="handleSignIn(event)">
            <div class="mb-3">
              <label class="form-label font-medium">Email Address</label>
              <div class="input-icon-container">
                <i class="fa-regular fa-envelope input-leading-icon"></i>
                <input
                  type="email"
                  id="input-email"
                  class="form-control padded-input"
                  placeholder="you@company.com"
                  required
                />
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label font-medium">Password</label>
              <div class="input-icon-container">
                <i class="fa-solid fa-lock input-leading-icon"></i>
                <input
                  type="password"
                  id="input-password"
                  class="form-control padded-input"
                  placeholder="Enter your password"
                  required
                />
              </div>
            </div>
            <button
              type="submit"
              class="btn btn-primary w-100 py-2 font-medium"
            >
              Sign In
            </button>
          </form>
        </div>
      </section>
    </main>

    <footer></footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- JS -->
    <script src="js/app.js"></script>
    <script>
      AOS.init({
        disable: "phone",
        duration: 800,
        once: true,
      });
    </script>
  </body>
</html>
