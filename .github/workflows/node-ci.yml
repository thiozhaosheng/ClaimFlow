name: ClaimFlow CI

on:
  push:
    branches: [ "main", "master", "capstone/testing-slice" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js 20
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Install dependencies (Backend)
      run: |
        cd backend/api
        npm ci
        
    - name: Run Unit/Integration Tests
      run: |
        cd backend/api
        npx jest
        
    - name: Install dependencies (Frontend)
      run: |
        cd frontend
        npm ci
        npx playwright install --with-deps
        
    - name: Run E2E Tests
      run: |
        cd frontend
        npx playwright test
