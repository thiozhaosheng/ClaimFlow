name: ClaimFlow CI

on:
  push:
    # infra/azure-deployment is the branch Azure deploys from, so it needs the
    # same gate as main — otherwise the only branch that reaches production is
    # the one branch CI never checks.
    branches: [ "main", "master", "infra/azure-deployment" ]
  pull_request:
    branches: [ "main", "master", "infra/azure-deployment" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # A disposable Postgres for the integration tier. Deliberately NOT the Azure
    # server: GitHub runners have dynamic egress IPs, so reaching Azure from here
    # would mean opening the database firewall to a range that cannot be pinned
    # down. These credentials are local to the runner and die with the job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: claimflow
          POSTGRES_PASSWORD: claimflow
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js 20
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Install dependencies (Backend)
      run: |
        cd backend/api
        npm ci

    - name: Run Unit Tests
      run: |
        cd backend/api
        npx jest --selectProjects unit

    # Creates a uniquely-named database on the service container, pushes the
    # schema, seeds it, runs the suites and drops it again. Split from the unit
    # step so a database problem is never mistaken for a failing unit test.
    - name: Run Integration Tests (ephemeral database)
      run: |
        cd backend/api
        npm run test:integration:ephemeral
      env:
        INTEGRATION_DB_ADMIN_URL: postgresql://claimflow:claimflow@localhost:5432/postgres
        JWT_SECRET: ci-only-jwt-secret-not-used-outside-this-job


    - name: Install dependencies (Frontend)
      run: |
        cd frontend
        npm ci
        npx playwright install --with-deps
        
    - name: Run E2E Tests
      run: |
        cd frontend
        npx playwright test
