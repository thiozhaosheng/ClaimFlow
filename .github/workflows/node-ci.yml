name: ClaimFlow CI

on:
  push:
    # infra/azure-deployment is the branch Azure deploys from, so it needs the
    # same gate as main — otherwise the only branch that reaches production is
    # the one branch CI never checks.
    branches: [ "main", "master", "infra/azure-deployment" ]
  pull_request:
    branches: [ "main", "master", "infra/azure-deployment" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies (Backend)
      run: |
        cd backend/api
        npm ci
        
    - name: Run Unit/Integration Tests
      run: |
        cd backend/api
        npx jest
        
    - name: Install dependencies (Frontend)
      run: |
        cd frontend
        npm ci
        npx playwright install --with-deps
        
    - name: Run E2E Tests
      run: |
        cd frontend
        npx playwright test
