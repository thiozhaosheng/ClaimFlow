  <line x1="28" y1="148" x2="292" y2="148" class="rule" />
  <text x="28" y="176" class="r">Consultation</text><text x="292" y="176" text-anchor="end" class="r">134.84</text>
  <line x1="28" y1="188" x2="292" y2="188" class="rule" />
